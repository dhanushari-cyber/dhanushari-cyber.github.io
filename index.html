<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dhanushari V | Cybersecurity Student</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1220; --bg-alt:#101a2e; --panel:#0e1729;
    --line:#213050; --text:#e7ecf5; --muted:#8b97ac;
    --accent:#35d0c0; --accent2:#f2b84b;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif; line-height:1.6;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:48px 48px;
    background-attachment:fixed;
  }
  h1,h2,h3{font-family:'Space Grotesk',sans-serif; font-weight:600;}
  a{color:inherit; text-decoration:none;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .wrap{max-width:920px; margin:0 auto; padding:0 24px;}

  /* nav */
  nav{position:sticky; top:0; z-index:10; backdrop-filter:blur(8px); background:rgba(11,18,32,.85); border-bottom:1px solid var(--line);}
  nav .wrap{display:flex; justify-content:space-between; align-items:center; height:64px;}
  .brand{font-family:'JetBrains Mono',monospace; color:var(--accent); font-size:15px;}
  .navlinks{display:flex; gap:28px;}
  .navlinks a{color:var(--muted); font-size:14px; transition:color .2s;}
  .navlinks a:hover{color:var(--text);}

  /* hero */
  .hero{padding:120px 0 90px; border-bottom:1px solid var(--line);}
  .tag{font-family:'JetBrains Mono',monospace; color:var(--accent2); font-size:13px; margin-bottom:18px; display:flex; align-items:center; gap:8px;}
  .tag::before{content:''; width:7px; height:7px; border-radius:50%; background:var(--accent2); box-shadow:0 0 8px var(--accent2);}
  .hero h1{font-size:56px; line-height:1.05; margin-bottom:6px;}
  .hero h2{font-size:22px; color:var(--muted); font-weight:400; margin-bottom:28px;}
  .term{
    background:var(--panel); border:1px solid var(--line); border-radius:4px;
    padding:20px 22px; max-width:500px; margin-bottom:34px;
    font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--muted);
    position:relative;
  }
  .term .cursor{display:inline-block; width:8px; height:16px; background:var(--accent); animation:blink 1s step-end infinite; vertical-align:-3px;}
  @keyframes blink{50%{opacity:0;}}
  .term span.k{color:var(--accent);}
  .btnrow{display:flex; gap:14px;}
  .btn{padding:12px 22px; border-radius:3px; font-size:14px; font-weight:500; border:1px solid var(--line);}
  .btn.primary{background:var(--accent); color:var(--bg); border:none;}
  .btn.ghost{color:var(--text);}
  .btn:hover{opacity:.85;}

  /* sections */
  section{padding:80px 0; border-bottom:1px solid var(--line);}
  .eyebrow{color:var(--accent); font-family:'JetBrains Mono',monospace; font-size:13px; margin-bottom:10px;}
  section h2.title{font-size:32px; margin-bottom:8px;}
  section .sub{color:var(--muted); margin-bottom:40px; max-width:60ch;}

  .panel{
    border:1px solid var(--line); background:var(--panel); border-radius:4px;
    padding:26px; position:relative;
  }
  .panel::before,.panel::after{content:''; position:absolute; width:10px; height:10px; border:1px solid var(--accent); opacity:.6;}
  .panel::before{top:-1px; left:-1px; border-right:none; border-bottom:none;}
  .panel::after{bottom:-1px; right:-1px; border-left:none; border-top:none;}

  .about-grid{display:grid; grid-template-columns:1.1fr .9fr; gap:32px;}
  .about-grid p{color:var(--muted); margin-bottom:14px;}
  .about-grid .panel div{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .about-grid .panel div:last-child{border-bottom:none;}
  .about-grid .panel .k{color:var(--accent2);}

  .edu-panel{display:flex; gap:22px; align-items:flex-start;}
  .edu-badge{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--accent2); border:1px solid var(--accent2); padding:3px 9px; border-radius:20px; white-space:nowrap;}
  .edu-panel h3{font-size:20px; margin:6px 0 4px;}
  .edu-panel .role{color:var(--accent); font-size:14px; margin-bottom:10px;}
  .edu-panel p{color:var(--muted);}

  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
  .grid3 .panel .ic{font-size:26px; margin-bottom:14px;}
  .grid3 .panel h3{font-size:18px; margin-bottom:8px;}
  .grid3 .panel p{color:var(--muted); font-size:14px;}

  .learn-list{display:flex; flex-direction:column; gap:1px; border:1px solid var(--line); border-radius:4px; overflow:hidden;}
  .learn-item{display:flex; gap:18px; padding:18px 22px; background:var(--panel); align-items:baseline;}
  .learn-item .ic{color:var(--accent); font-size:15px;}
  .learn-item h3{font-size:16px; margin-bottom:3px;}
  .learn-item p{color:var(--muted); font-size:14px;}

  .journey p{color:var(--muted); max-width:64ch;}

  footer{padding:36px 0; text-align:center; color:var(--muted); font-size:13px; font-family:'JetBrains Mono',monospace;}
  footer a{color:var(--accent);}

  @media(max-width:720px){
    .navlinks{display:none;}
    .hero{padding:80px 0 60px;}
    .hero h1{font-size:38px;}
    .about-grid{grid-template-columns:1fr;}
    .grid3{grid-template-columns:1fr;}
  }
  @media (prefers-reduced-motion:reduce){
    .term .cursor{animation:none;}
  }
</style>
</head>
